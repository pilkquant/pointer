[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pointer-cli"
version = "0.2.1"
description = "Point it at Python. Get an evidence-backed path to native Rust — static analysis + Codex-backed porting."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "pilkquant" },
]
maintainers = [
    { name = "Madoka" },
]
keywords = ["python", "rust", "cpp", "porting", "static-analysis", "portability", "migration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.scripts]
pointer = "pointer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/pilkquant/pointer"
Repository = "https://github.com/pilkquant/pointer"
Issues = "https://github.com/pilkquant/pointer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pointer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["SIM102", "SIM108", "SIM114"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
