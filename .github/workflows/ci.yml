name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.1
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (editable)
        run: pip install -e .
      - name: Install test dependencies
        run: pip install pytest==9.1.1
      - name: Run tests
        run: python -m pytest -q

  build-and-smoke:
    name: Build & smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: pip install build==1.3.1
      - name: Build wheel and sdist
        run: python -m build
      - name: Create clean venv and install wheel
        shell: bash
        run: |
          python -m venv /tmp/clean-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            /tmp/clean-venv/Scripts/python -m pip install dist/*.whl
          else
            /tmp/clean-venv/bin/python -m pip install dist/*.whl
          fi
      - name: Smoke test --help
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            /tmp/clean-venv/Scripts/pointer --help
          else
            /tmp/clean-venv/bin/pointer --help
          fi
      - name: Smoke test --version
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            /tmp/clean-venv/Scripts/pointer --version
          else
            /tmp/clean-venv/bin/pointer --version
          fi
      - name: Smoke test doctor
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            /tmp/clean-venv/Scripts/pointer doctor
          else
            /tmp/clean-venv/bin/pointer doctor
          fi
      - name: Smoke test analyze on fixture
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            /tmp/clean-venv/Scripts/pointer analyze tests/fixtures/pure_python --output /tmp/pointer-smoke
            ls /tmp/pointer-smoke/report.md /tmp/pointer-smoke/report.json
          else
            /tmp/clean-venv/bin/pointer analyze tests/fixtures/pure_python --output /tmp/pointer-smoke
            ls /tmp/pointer-smoke/report.md /tmp/pointer-smoke/report.json
          fi
